[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mbox-md"
dynamic = ["version"]
description = "Convert Gmail Takeout and other mbox archives into Markdown files with deduplicated attachments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Dupont" }]
keywords = ["mbox", "email", "markdown", "gmail", "takeout", "archive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "compress-utils>=0.8.0",
    "markdownify>=1.2.3",
    "rich>=15.0.0",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/dupontcyborg/mbox-md"

[project.scripts]
mbox-md = "mbox_md._cli:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.16.2",
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.hatch.version]
path = "src/mbox_md/__init__.py"

# Allow-list what ships, so local-data/ or stray real mail can never be packaged.
[tool.hatch.build.targets.sdist]
only-include = ["src/mbox_md", "tests", "pyproject.toml", "README.md", "TODO.md", "LICENSE"]
exclude = ["tests/**/*.mbox.zst"]

[tool.hatch.build.targets.wheel]
packages = ["src/mbox_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: needs the gitignored real-mail sample in local-data/ (skipped when absent)"]

[tool.coverage.run]
source = ["mbox_md"]
branch = true
# Worker processes run most of the conversion code; measure them too.
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 95  # measured 98% on 2026-09-30; raise it as coverage grows
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["markdownify"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# compress-utils 0.8.0 ships .pyi stubs but not the py.typed marker; use the stubs anyway.
module = ["compress_utils", "compress_utils.*"]
follow_untyped_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
